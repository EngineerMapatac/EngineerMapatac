name: Generate Snake

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main[cite: 3]

jobs:
  generate:
    runs-on: ubuntu-latest[cite: 3]
    timeout-minutes: 10[cite: 3]
    permissions:
      contents: write[cite: 3]
    steps:
      - name: Checkout[cite: 3]
        uses: actions/checkout@v4[cite: 3]

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?step_duration_ms=500
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&step_duration_ms=500

      - name: Push to output branch[cite: 3]
        uses: crazy-max/ghaction-github-pages@v4[cite: 3]
        with:
          target_branch: output[cite: 3]
          build_dir: dist[cite: 3]
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
